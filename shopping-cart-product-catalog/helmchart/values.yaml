serviceName: product-catalog
namespaceOverride: shopping-cart-apps
replicaCount: 1
image:
  repository: shopping-cart-product-catalog
  tag: v1.4.6-otel-20261003
  pullPolicy: IfNotPresent
imagePullSecrets: []
commonLabels: {}
podAnnotations:
  prometheus.io/scrape: 'true'
  prometheus.io/port: '8080'
  prometheus.io/path: /metrics
serviceAccount:
  create: true
  name: product-catalog
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  portName: http
containerPort: 8080
config:
  ENVIRONMENT: production
  DEBUG: 'false'
  HOST: 0.0.0.0
  PORT: '8080'
  DB_HOST: postgresql-products.shopping-cart-data.svc.cluster.local
  DB_PORT: '5432'
  DB_NAME: products
  RABBITMQ_HOST: rabbitmq.shopping-cart-data.svc.cluster.local
  RABBITMQ_PORT: '5672'
  RABBITMQ_VHOST: /
  VAULT_ADDR: http://vault.vault.svc.cluster.local:8200
  VAULT_RABBITMQ_PATH: rabbitmq
  VAULT_ROLE: product-catalog
  RATE_LIMIT_PER_MINUTE: '100'
  RATE_LIMIT_PER_SECOND: '20'
  RATE_LIMIT_BURST: '50'
  OAUTH2_ENABLED: 'false'
  OAUTH2_ISSUER_URI: http://keycloak.shopping-cart-identity.svc.cluster.local:8080/realms/shopping-cart
  OAUTH2_CLIENT_ID: product-catalog
  LOCAL_AUTH_ENABLED: 'true'
  OTEL_SERVICE_NAME: product-catalog
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.shopping-cart-observability.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=shopping-cart,deployment.environment=local
  OTEL_TRACES_SAMPLER: always_on
  OTEL_SDK_DISABLED: 'false'
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_BSP_MAX_QUEUE_SIZE: '512'
  OTEL_BSP_MAX_EXPORT_BATCH_SIZE: '128'
  OTEL_BSP_SCHEDULE_DELAY: '1000'
  OTEL_PROPAGATORS: tracecontext
externalSecret:
  enabled: true
  storeName: vault-backend
  storeKind: ClusterSecretStore
  targetName: product-catalog-secrets
  refreshInterval: 1h
  data:
  - secretKey: DB_USERNAME
    remoteRef:
      key: shopping-cart/data/postgresql-products
      property: username
  - secretKey: DB_PASSWORD
    remoteRef:
      key: shopping-cart/data/postgresql-products
      property: password
  - secretKey: RABBITMQ_USERNAME
    remoteRef:
      key: shopping-cart/data/rabbitmq
      property: username
  - secretKey: RABBITMQ_PASSWORD
    remoteRef:
      key: shopping-cart/data/rabbitmq
      property: password
  - secretKey: LOCAL_AUTH_JWT_SECRET
    remoteRef:
      key: shopping-cart/shared/auth
      property: jwtSecret
  - secretKey: INTERNAL_API_TOKEN
    remoteRef:
      key: shopping-cart/shared/auth
      property: jwtSecret
probes:
  startup:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 12
  liveness:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
extraVolumes:
- name: tmp
  emptyDir: {}
extraVolumeMounts:
- name: tmp
  mountPath: /tmp
affinity: {}
destinationRule:
  enabled: true
  host: product-catalog.shopping-cart-apps.svc.cluster.local
  connectionPool:
    http:
      http1MaxPendingRequests: 100
      maxRequestsPerConnection: 20
  outlierDetection:
    consecutive5xxErrors: 5
    interval: 10s
    baseEjectionTime: 30s
    maxEjectionPercent: 50
