{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "shopping-app.name" . }}
  namespace: {{ include "shopping-app.namespace" . }}
  labels:
    {{- include "shopping-app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef: {name: {{ .Values.externalSecret.storeName }}, kind: {{ .Values.externalSecret.storeKind }}}
  target: {name: {{ .Values.externalSecret.targetName }}, creationPolicy: Owner}
  data:
    {{- toYaml .Values.externalSecret.data | nindent 4 }}
{{- end }}

