serviceName: frontend
namespaceOverride: shopping-cart-apps
replicaCount: 1
image:
  repository: shopping-cart-frontend
  tag: canary-vn-flag-20260927-lab
  pullPolicy: IfNotPresent
imagePullSecrets: []
commonLabels: {}
podAnnotations: {}
serviceAccount:
  create: true
  name: frontend
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  portName: http
containerPort: 8080
config:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      gzip on;
      gzip_vary on;
      gzip_min_length 1024;
      gzip_types text/plain text/css application/javascript application/json;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
      }
      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }
      location / {
        try_files $uri $uri/ /index.html;
      }
      location ~ /\. {
        deny all;
      }
    }
externalSecret:
  enabled: false
  storeName: vault-backend
  storeKind: ClusterSecretStore
  targetName: frontend-secrets
  refreshInterval: 1h
  data: []
configVolume:
  enabled: true
  key: default.conf
  mountPath: /etc/nginx/conf.d/default.conf
  subPath: default.conf
probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  fsGroup: 101
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: [ALL]
extraVolumes:
  - name: nginx-cache
    emptyDir: {}
  - name: nginx-run
    emptyDir: {}
extraVolumeMounts:
  - name: nginx-cache
    mountPath: /var/cache/nginx
  - name: nginx-run
    mountPath: /run
affinity: {}
destinationRule:
  enabled: true
  host: frontend.shopping-cart-apps.svc.cluster.local
  connectionPool:
    http:
      http1MaxPendingRequests: 100
      maxRequestsPerConnection: 20
  outlierDetection:
    consecutive5xxErrors: 5
    interval: 10s
    baseEjectionTime: 30s
    maxEjectionPercent: 50
