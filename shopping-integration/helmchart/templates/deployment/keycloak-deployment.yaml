apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.keycloak.name }}
  namespace: {{ .Values.namespaces.identity }}
  labels: {app.kubernetes.io/name: keycloak, app.kubernetes.io/component: identity-provider, app.kubernetes.io/part-of: shopping-cart}
spec:
  replicas: {{ .Values.keycloak.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: keycloak}
  template:
    metadata:
      labels: {app.kubernetes.io/name: keycloak, app.kubernetes.io/component: identity-provider, app.kubernetes.io/part-of: shopping-cart}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: /metrics}
    spec:
      containers:
        - name: keycloak
          image: "{{ .Values.images.keycloak.repository }}:{{ .Values.images.keycloak.tag }}"
          imagePullPolicy: {{ .Values.images.keycloak.pullPolicy }}
          args:
            {{- toYaml .Values.keycloak.args | nindent 12 }}
          ports: [{name: http, containerPort: {{ .Values.keycloak.port }}}]
          envFrom:
            - configMapRef: {name: {{ .Values.keycloak.name }}-config}
            - secretRef: {name: {{ .Values.keycloak.secretName }}}
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          startupProbe: {httpGet: {path: /health/started, port: http}, initialDelaySeconds: 20, periodSeconds: 10, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /health/live, port: http}, initialDelaySeconds: 60, periodSeconds: 30, timeoutSeconds: 10}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, initialDelaySeconds: 30, periodSeconds: 10, timeoutSeconds: 5}
          volumeMounts:
            - {name: realm-import, mountPath: /opt/keycloak/data/import/shopping-cart-realm.json, subPath: shopping-cart-realm.json, readOnly: true}
      volumes:
        - name: realm-import
          configMap: {name: {{ .Values.keycloak.name }}-realm}

