apiVersion: v1
kind: ServiceAccount
metadata: {name: {{ .Values.rabbitmq.name }}, namespace: {{ .Values.namespaces.data }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: {{ .Values.rabbitmq.name }}-peer-discovery, namespace: {{ .Values.namespaces.data }}}
rules:
  - apiGroups: [""]
    resources: [endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: {{ .Values.rabbitmq.name }}-peer-discovery, namespace: {{ .Values.namespaces.data }}}
subjects:
  - {kind: ServiceAccount, name: {{ .Values.rabbitmq.name }}, namespace: {{ .Values.namespaces.data }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Values.rabbitmq.name }}-peer-discovery}

