apiVersion: v1
kind: Service
metadata: {name: {{ .Values.redis.name }}, namespace: {{ .Values.namespaces.data }}}
spec:
  clusterIP: None
  ports: [{name: redis, port: {{ .Values.redis.port }}, targetPort: redis, protocol: TCP}]
  selector: {app.kubernetes.io/name: redis, app.kubernetes.io/instance: cart}

