apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.namespaces.gateway }}
  labels:
    {{- include "integration.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ .Values.gateway.name }}-options
  listeners:
    - name: application
      hostname: {{ .Values.gateway.hosts.application | quote }}
      port: {{ .Values.gateway.listenerPort }}
      protocol: {{ .Values.gateway.protocol }}
      allowedRoutes: {namespaces: {from: All}}
    {{- range $index, $hostname := .Values.gateway.hosts.applicationAliases }}
    - name: {{ printf "application-%d" $index }}
      hostname: {{ $hostname | quote }}
      port: {{ $.Values.gateway.listenerPort }}
      protocol: {{ $.Values.gateway.protocol }}
      allowedRoutes: {namespaces: {from: All}}
    {{- end }}
    - name: keycloak
      hostname: {{ .Values.gateway.hosts.keycloak | quote }}
      port: {{ .Values.gateway.listenerPort }}
      protocol: {{ .Values.gateway.protocol }}
      allowedRoutes: {namespaces: {from: All}}
    - name: vault
      hostname: {{ .Values.gateway.hosts.vault | quote }}
      port: {{ .Values.gateway.listenerPort }}
      protocol: {{ .Values.gateway.protocol }}
      allowedRoutes: {namespaces: {from: All}}
