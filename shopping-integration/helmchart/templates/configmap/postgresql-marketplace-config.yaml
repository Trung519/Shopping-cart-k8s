apiVersion: v1
kind: ConfigMap
metadata: {name: {{ .Values.postgresql.marketplace.name }}-init, namespace: {{ .Values.namespaces.data }} }
data:
  00-create-service-databases.sh: |
    #!/bin/sh
    set -eu
    create_service_database() {
      service_user="$1"
      service_password="$2"
      service_database="$3"
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
        --set=service_user="$service_user" --set=service_password="$service_password" <<'SQL'
    SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'service_user', :'service_password')
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'service_user')\gexec
    SQL
      if ! psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" -tAc "SELECT 1 FROM pg_database WHERE datname='$service_database'" | grep -q 1; then
        createdb --username "$POSTGRES_USER" --owner "$service_user" "$service_database"
      fi
    }
    create_service_database "$SELLER_DB_USER" "$SELLER_DB_PASSWORD" "$SELLER_DB_NAME"
    create_service_database "$INVENTORY_DB_USER" "$INVENTORY_DB_PASSWORD" "$INVENTORY_DB_NAME"
    create_service_database "$CHECKOUT_DB_USER" "$CHECKOUT_DB_PASSWORD" "$CHECKOUT_DB_NAME"
