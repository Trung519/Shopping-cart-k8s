apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.postgresql.marketplace.name }}
  namespace: {{ .Values.namespaces.data }}
  labels: {app.kubernetes.io/name: postgresql, app.kubernetes.io/instance: marketplace, app.kubernetes.io/part-of: shopping-cart}
spec:
  serviceName: {{ .Values.postgresql.marketplace.name }}
  replicas: {{ .Values.postgresql.marketplace.replicas }}
  selector: {matchLabels: {app.kubernetes.io/name: postgresql, app.kubernetes.io/instance: marketplace}}
  template:
    metadata: {labels: {app.kubernetes.io/name: postgresql, app.kubernetes.io/instance: marketplace, app.kubernetes.io/part-of: shopping-cart}}
    spec:
      securityContext: {fsGroup: 999}
      containers:
        - name: postgresql
          image: "{{ .Values.images.postgresql.repository }}:{{ .Values.images.postgresql.tag }}"
          imagePullPolicy: {{ .Values.images.postgresql.pullPolicy }}
          ports: [{name: postgresql, containerPort: {{ .Values.postgresql.port }}}]
          env:
            - {name: POSTGRES_DB, value: {{ .Values.postgresql.marketplace.database | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.postgresql.username | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.postgresql.marketplace.secretName }}, key: adminPassword}}
            - {name: SELLER_DB_USER, value: {{ .Values.postgresql.marketplace.users.seller.username | quote }}}
            - {name: SELLER_DB_NAME, value: {{ .Values.postgresql.marketplace.users.seller.database | quote }}}
            - name: SELLER_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.postgresql.marketplace.secretName }}, key: sellerPassword}}
            - {name: INVENTORY_DB_USER, value: {{ .Values.postgresql.marketplace.users.inventory.username | quote }}}
            - {name: INVENTORY_DB_NAME, value: {{ .Values.postgresql.marketplace.users.inventory.database | quote }}}
            - name: INVENTORY_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.postgresql.marketplace.secretName }}, key: inventoryPassword}}
            - {name: CHECKOUT_DB_USER, value: {{ .Values.postgresql.marketplace.users.checkout.username | quote }}}
            - {name: CHECKOUT_DB_NAME, value: {{ .Values.postgresql.marketplace.users.checkout.database | quote }}}
            - name: CHECKOUT_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.postgresql.marketplace.secretName }}, key: checkoutPassword}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          resources:
            {{- toYaml .Values.postgresql.marketplace.resources | nindent 12 }}
          startupProbe: {exec: {command: [pg_isready, -U, {{ .Values.postgresql.username }}, -d, {{ .Values.postgresql.marketplace.database }}]}, periodSeconds: 5, failureThreshold: 30}
          livenessProbe: {exec: {command: [pg_isready, -U, {{ .Values.postgresql.username }}, -d, {{ .Values.postgresql.marketplace.database }}]}, initialDelaySeconds: 30, periodSeconds: 10}
          readinessProbe: {exec: {command: [pg_isready, -U, {{ .Values.postgresql.username }}, -d, {{ .Values.postgresql.marketplace.database }}]}, initialDelaySeconds: 5, periodSeconds: 5}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d/00-create-service-databases.sh, subPath: 00-create-service-databases.sh}
      volumes:
        - name: init
          configMap: {name: {{ .Values.postgresql.marketplace.name }}-init, defaultMode: 0755}
  volumeClaimTemplates:
    - metadata: {name: data, labels: {app.kubernetes.io/name: postgresql, app.kubernetes.io/instance: marketplace}}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.postgresql.marketplace.storage }}}}
