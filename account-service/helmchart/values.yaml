serviceName: account-service
namespaceOverride: shopping-cart-apps
replicaCount: 1
image:
  repository: account-service
  tag: v0.2.3-otel-20261003
  pullPolicy: IfNotPresent
commonLabels: {}
serviceAccount:
  create: true
  name: account-service
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  portName: http
containerPort: 8080
config:
  HTTP_ADDRESS: :8080
  KEYCLOAK_URL: http://keycloak.shopping-cart-identity.svc.cluster.local
  KEYCLOAK_REALM: shopping-cart
  KEYCLOAK_CLIENT_ID: account-service
  OTEL_SERVICE_NAME: account-service
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.shopping-cart-observability.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=shopping-cart,deployment.environment=local
  OTEL_TRACES_SAMPLER: always_on
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_SDK_DISABLED: 'false'
  OTEL_BSP_MAX_QUEUE_SIZE: '512'
  OTEL_BSP_MAX_EXPORT_BATCH_SIZE: '128'
  OTEL_BSP_SCHEDULE_DELAY: '1000'
  OTEL_PROPAGATORS: tracecontext
externalSecret:
  enabled: true
  storeName: vault-backend
  storeKind: ClusterSecretStore
  targetName: account-service-secrets
  refreshInterval: 1h
  data:
  - secretKey: KEYCLOAK_CLIENT_SECRET
    remoteRef:
      key: shopping-cart/apps/account-service
      property: keycloakClientSecret
  - secretKey: SERVICE_AUTH_TOKEN
    remoteRef:
      key: shopping-cart/shared/service-auth
      property: token
probes:
  startup:
    path: /health/ready
    initialDelaySeconds: 2
    periodSeconds: 3
    timeoutSeconds: 2
    failureThreshold: 30
  liveness:
    path: /health/live
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /health/ready
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 192Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
destinationRule:
  enabled: true
  host: account-service.shopping-cart-apps.svc.cluster.local
  connectionPool:
    http:
      http1MaxPendingRequests: 50
      maxRequestsPerConnection: 50
  outlierDetection:
    consecutive5xxErrors: 5
    interval: 10s
    baseEjectionTime: 30s
    maxEjectionPercent: 50
