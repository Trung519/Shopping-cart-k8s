apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "shopping-app.name" . }}
  namespace: {{ include "shopping-app.namespace" . }}
  labels:
    {{- include "shopping-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "shopping-app.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    {{- if eq .Values.rollout.strategy "blueGreen" }}
    blueGreen:
      activeService: {{ include "shopping-app.name" . }}
      previewService: {{ include "shopping-app.name" . }}-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: {{ .Values.rollout.blueGreen.scaleDownDelaySeconds }}
      {{- with .Values.rollout.blueGreen.previewReplicaCount }}
      previewReplicaCount: {{ . }}
      {{- end }}
    {{- else }}
    canary:
      steps:
        {{- toYaml .Values.rollout.canary.steps | nindent 8 }}
    {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "shopping-app.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: shopping-cart
      annotations:
        checksum/config: {{ include "shopping-app.configChecksum" . }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "shopping-app.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            {{- omit .Values.probes.liveness "path" | toYaml | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            {{- omit .Values.probes.readiness "path" | toYaml | nindent 12 }}
          volumeMounts:
            {{- if .Values.configVolume.enabled }}
            - name: app-config
              mountPath: {{ .Values.configVolume.mountPath }}
              subPath: {{ .Values.configVolume.subPath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if .Values.configVolume.enabled }}
        - name: app-config
          configMap:
            name: {{ include "shopping-app.name" . }}-config
            items:
              - key: {{ .Values.configVolume.key }}
                path: {{ .Values.configVolume.subPath }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

