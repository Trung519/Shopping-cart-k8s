{{- if eq .Values.rollout.strategy "blueGreen" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shopping-app.name" . }}-preview
  {{- include "shopping-app.metadata" . | nindent 2 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "shopping-app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}