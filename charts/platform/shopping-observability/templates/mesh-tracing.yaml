{{- if .Values.tracing.enabled }}
{{- range $namespace := .Values.global.observability.applicationNamespaces }}
---
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: shopping-request-tracing
  namespace: {{ $namespace }}
spec:
  accessLogging:
    - providers:
        - name: shopping-safe-logs
  tracing:
    - providers:
        - name: shopping-otel
      randomSamplingPercentage: 100
      useRequestIdForTraceSampling: false
      customTags:
        deployment.environment:
          literal: {value: {{ $.Values.global.observability.environment | quote }}}
{{- end }}
{{- end }}
