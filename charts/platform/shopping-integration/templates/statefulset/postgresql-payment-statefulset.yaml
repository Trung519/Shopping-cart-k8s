apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.postgresql.payment.name }}
  namespace: {{ .Values.namespaces.data }}
  labels: {app.kubernetes.io/name: postgresql, app.kubernetes.io/instance: payment, app.kubernetes.io/part-of: shopping-cart, pci-scope: "true"}
spec:
  serviceName: {{ .Values.postgresql.payment.name }}
  replicas: {{ .Values.postgresql.payment.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: postgresql, app.kubernetes.io/instance: payment}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgresql, app.kubernetes.io/instance: payment, app.kubernetes.io/part-of: shopping-cart, pci-scope: "true"}
    spec:
      securityContext: {fsGroup: 999, runAsUser: 999, runAsNonRoot: true}
      containers:
        - name: postgresql
          image: "{{ .Values.images.postgresql.repository }}:{{ .Values.images.postgresql.tag }}"
          imagePullPolicy: {{ .Values.images.postgresql.pullPolicy }}
          ports: [{name: postgresql, containerPort: {{ .Values.postgresql.port }}, protocol: TCP}]
          env:
            - {name: POSTGRES_DB, value: {{ .Values.postgresql.payment.database | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.postgresql.username | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.postgresql.payment.secretName }}, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          resources:
            {{- toYaml .Values.postgresql.payment.resources | nindent 12 }}
          livenessProbe:
            exec: {command: [/bin/sh, -c, {{ printf "exec pg_isready -U %s -d %s -h 127.0.0.1 -p %d" .Values.postgresql.username .Values.postgresql.payment.database (int .Values.postgresql.port) | quote }}]}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec: {command: [/bin/sh, -c, {{ printf "exec pg_isready -U %s -d %s -h 127.0.0.1 -p %d" .Values.postgresql.username .Values.postgresql.payment.database (int .Values.postgresql.port) | quote }}]}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init-scripts, mountPath: /docker-entrypoint-initdb.d}
      volumes:
        - name: init-scripts
          configMap: {name: {{ .Values.postgresql.payment.name }}-init}
  volumeClaimTemplates:
    - metadata: {name: data, labels: {app.kubernetes.io/name: postgresql, app.kubernetes.io/instance: payment}}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.postgresql.payment.storage }}}}

