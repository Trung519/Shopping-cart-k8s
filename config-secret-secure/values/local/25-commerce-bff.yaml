namespaceOverride: shopping-cart-apps
replicaCount: 2
image:
  repository: commerce-bff
  tag: v0.1.3
  pullPolicy: IfNotPresent
config:
  PUBLIC_URL: http://shopping-cart.localhost:8080
  FRONTEND_URL: http://shopping-cart.localhost:8080
  COOKIE_SECURE: "false"
  OIDC_ISSUER_INTERNAL: http://keycloak.shopping-cart-identity.svc.cluster.local/realms/shopping-cart
  OIDC_AUTHORIZE_URL: http://keycloak.localhost:8080/realms/shopping-cart/protocol/openid-connect/auth
  OIDC_END_SESSION_URL: http://keycloak.localhost:8080/realms/shopping-cart/protocol/openid-connect/logout
  OIDC_CLIENT_ID: commerce-bff
  OIDC_REDIRECT_URL: http://shopping-cart.localhost:8080/api/v2/auth/callback
  PRODUCT_CATALOG_URL: http://product-catalog.shopping-cart-apps.svc.cluster.local
  BASKET_URL: http://basket-service.shopping-cart-apps.svc.cluster.local:8083
  ORDER_URL: http://order-service.shopping-cart-apps.svc.cluster.local
  PAYMENT_URL: http://payment-service.shopping-cart-payment.svc.cluster.local
  ACCOUNT_URL: http://account-service.shopping-cart-apps.svc.cluster.local
  SELLER_URL: http://seller-service.shopping-cart-apps.svc.cluster.local
