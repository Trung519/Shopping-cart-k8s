namespaceOverride: shopping-cart-apps
replicaCount: 1
image:
  repository: shopping-cart-product-catalog
  tag: v1.3.2
  pullPolicy: IfNotPresent
config:
  ENVIRONMENT: production
  DEBUG: "false"
  HOST: 0.0.0.0
  PORT: "8080"
  DB_HOST: postgresql-products.shopping-cart-data.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: products
  RABBITMQ_HOST: rabbitmq.shopping-cart-data.svc.cluster.local
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: /
  VAULT_ADDR: http://vault.vault.svc.cluster.local:8200
  VAULT_RABBITMQ_PATH: rabbitmq
  VAULT_ROLE: product-catalog
  RATE_LIMIT_PER_MINUTE: "100"
  RATE_LIMIT_PER_SECOND: "20"
  RATE_LIMIT_BURST: "50"
  OAUTH2_ENABLED: "true"
  OAUTH2_ISSUER_URI: http://keycloak.localhost:8080/realms/shopping-cart
  OAUTH2_JWKS_URI: http://keycloak.shopping-cart-identity.svc.cluster.local/realms/shopping-cart/protocol/openid-connect/certs
  OAUTH2_CLIENT_ID: product-catalog
  LOCAL_AUTH_ENABLED: "false"
