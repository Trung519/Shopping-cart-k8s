namespaceOverride: shopping-cart-apps
replicaCount: 1
image:
  repository: shopping-cart-order
  tag: v1.0.4
  pullPolicy: IfNotPresent
config:
  SERVER_PORT: "8080"
  SPRING_PROFILES_ACTIVE: kubernetes
  DB_HOST: postgresql-orders.shopping-cart-data.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: orders
  RABBITMQ_HOST: rabbitmq.shopping-cart-data.svc.cluster.local
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: /
  SPRING_RABBITMQ_HOST: rabbitmq.shopping-cart-data.svc.cluster.local
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_VIRTUAL_HOST: /
  VAULT_ENABLED: "false"
  SPRING_CLOUD_VAULT_ENABLED: "false"
  VAULT_ADDR: http://vault.vault.svc.cluster.local:8200
  VAULT_ROLE: order-publisher
  VAULT_RABBITMQ_PATH: rabbitmq
  RATE_LIMIT_PER_MINUTE: "100"
  RATE_LIMIT_PER_SECOND: "20"
  RATE_LIMIT_BURST: "50"
  LOGGING_LEVEL_ROOT: INFO
  LOGGING_LEVEL_COM_SHOPPINGCART: INFO
  OAUTH2_ENABLED: "false"
  OAUTH2_ISSUER_URI: http://keycloak.shopping-cart-identity.svc.cluster.local:8080/realms/shopping-cart
  OAUTH2_JWK_SET_URI: http://keycloak.shopping-cart-identity.svc.cluster.local:8080/realms/shopping-cart/protocol/openid-connect/certs
