namespaceOverride: shopping-cart-apps
replicaCount: 1
image:
  repository: shopping-cart-basket
  tag: v1.4.0
  pullPolicy: IfNotPresent
config:
  SERVER_PORT: "8083"
  REDIS_HOST: redis-cart.shopping-cart-data.svc.cluster.local
  REDIS_PORT: "6379"
  CART_TTL: 168h
  OAUTH2_ENABLED: "true"
  OAUTH2_ISSUER_URI: http://keycloak.localhost:8080/realms/shopping-cart
  OAUTH2_JWKS_URI: http://keycloak.shopping-cart-identity.svc.cluster.local/realms/shopping-cart/protocol/openid-connect/certs
  OAUTH2_CLIENT_ID: commerce-bff
  LOCAL_AUTH_ENABLED: "false"
  LOCAL_AUTH_TOKEN_TTL: 24h
  RABBITMQ_HOST: rabbitmq.shopping-cart-data.svc.cluster.local
  RABBITMQ_PORT: "5672"
  ORDER_SERVICE_URL: http://order-service.shopping-cart-apps.svc.cluster.local
  LOG_LEVEL: info
