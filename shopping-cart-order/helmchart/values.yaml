serviceName: order-service
namespaceOverride: shopping-cart-apps
replicaCount: 1
image:
  repository: shopping-cart-order
  tag: v1.1.1-tracing-errorfix-20261003
  pullPolicy: IfNotPresent
imagePullSecrets: []
commonLabels: {}
podAnnotations:
  prometheus.io/scrape: 'true'
  prometheus.io/port: '8080'
  prometheus.io/path: /actuator/prometheus
serviceAccount:
  create: true
  name: order-service
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  portName: http
containerPort: 8080
config:
  SERVER_PORT: '8080'
  SPRING_PROFILES_ACTIVE: kubernetes
  DB_HOST: postgresql-orders.shopping-cart-data.svc.cluster.local
  DB_PORT: '5432'
  DB_NAME: orders
  RABBITMQ_HOST: rabbitmq.shopping-cart-data.svc.cluster.local
  RABBITMQ_PORT: '5672'
  RABBITMQ_VHOST: /
  SPRING_RABBITMQ_HOST: rabbitmq.shopping-cart-data.svc.cluster.local
  SPRING_RABBITMQ_PORT: '5672'
  SPRING_RABBITMQ_VIRTUAL_HOST: /
  VAULT_ENABLED: 'false'
  SPRING_CLOUD_VAULT_ENABLED: 'false'
  VAULT_ADDR: http://vault.vault.svc.cluster.local:8200
  VAULT_ROLE: order-publisher
  VAULT_RABBITMQ_PATH: rabbitmq
  RATE_LIMIT_PER_MINUTE: '100'
  RATE_LIMIT_PER_SECOND: '20'
  RATE_LIMIT_BURST: '50'
  LOGGING_LEVEL_ROOT: INFO
  LOGGING_LEVEL_COM_SHOPPINGCART: INFO
  OAUTH2_ENABLED: 'false'
  OAUTH2_ISSUER_URI: http://keycloak.shopping-cart-identity.svc.cluster.local:8080/realms/shopping-cart
  OAUTH2_JWK_SET_URI: http://keycloak.shopping-cart-identity.svc.cluster.local:8080/realms/shopping-cart/protocol/openid-connect/certs
  OTEL_SERVICE_NAME: order-service
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.shopping-cart-observability.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=shopping-cart,deployment.environment=local
  OTEL_TRACES_SAMPLER: always_on
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_SDK_DISABLED: 'false'
  OTEL_BSP_MAX_QUEUE_SIZE: '512'
  OTEL_BSP_MAX_EXPORT_BATCH_SIZE: '128'
  OTEL_BSP_SCHEDULE_DELAY: '1000'
  OTEL_PROPAGATORS: tracecontext
  JAVA_TOOL_OPTIONS: -javaagent:/otel/opentelemetry-javaagent.jar
  LOGGING_PATTERN_CONSOLE: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level trace_id=%X{trace_id}
    span_id=%X{span_id} %logger{36} - %msg%n'
externalSecret:
  enabled: true
  storeName: vault-backend
  storeKind: ClusterSecretStore
  targetName: order-service-secrets
  refreshInterval: 1h
  data:
  - secretKey: DB_USERNAME
    remoteRef:
      key: shopping-cart/data/postgresql-orders
      property: username
  - secretKey: DB_PASSWORD
    remoteRef:
      key: shopping-cart/data/postgresql-orders
      property: password
  - secretKey: RABBITMQ_USERNAME
    remoteRef:
      key: shopping-cart/data/rabbitmq
      property: username
  - secretKey: RABBITMQ_PASSWORD
    remoteRef:
      key: shopping-cart/data/rabbitmq
      property: password
  - secretKey: SPRING_RABBITMQ_USERNAME
    remoteRef:
      key: shopping-cart/data/rabbitmq
      property: username
  - secretKey: SPRING_RABBITMQ_PASSWORD
    remoteRef:
      key: shopping-cart/data/rabbitmq
      property: password
probes:
  startup:
    path: /actuator/health
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
extraVolumes:
- name: tmp
  emptyDir: {}
- name: otel-agent
  emptyDir:
    sizeLimit: 32Mi
extraVolumeMounts:
- name: tmp
  mountPath: /tmp
- name: otel-agent
  mountPath: /otel
  readOnly: true
affinity: {}
destinationRule:
  enabled: true
  host: order-service.shopping-cart-apps.svc.cluster.local
  connectionPool:
    http:
      http1MaxPendingRequests: 100
      maxRequestsPerConnection: 20
  outlierDetection:
    consecutive5xxErrors: 5
    interval: 10s
    baseEjectionTime: 30s
    maxEjectionPercent: 50
initContainers:
- name: otel-javaagent
  image: shopping-otel-javaagent:2.31.1-r1
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
  volumeMounts:
  - name: otel-agent
    mountPath: /otel
