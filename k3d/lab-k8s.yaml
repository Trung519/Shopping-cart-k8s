# Create from the repository root: k3d cluster create --config k3d/lab-k8s.yaml
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: lab-k8s
servers: 1
agents: 2
image: rancher/k3s:v1.33.6-k3s1
kubeAPI:
  hostIP: 127.0.0.1
  hostPort: "6550"
ports:
- port: 127.0.0.1:8080:30080
  nodeFilters:
  - loadbalancer
- port: 127.0.0.1:8443:30443
  nodeFilters:
  - loadbalancer
options:
  k3s:
    extraArgs:
    - arg: --disable=traefik
      nodeFilters:
      - server:*
