{{- $secretName := "grafana-admin" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shopping-observability.labels" . | nindent 4 }}
type: Opaque
data:
  admin-user: {{ "admin" | b64enc | quote }}
  {{- if $existing }}
  admin-password: {{ index $existing.data "admin-password" | quote }}
  {{- else }}
  admin-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
