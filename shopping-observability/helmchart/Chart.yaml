apiVersion: v2
name: shopping-observability
description: Logs and metrics observability for the shopping-cart lab cluster
type: application
version: 0.3.0
appVersion: 0.1.0
dependencies:
- name: loki
  version: 7.2.0
  repository: file://charts/loki
  condition: loki.enabled
- name: grafana
  version: 10.5.15
  repository: file://charts/grafana
  condition: grafana.enabled
- name: fluent-bit
  version: 0.57.9
  repository: file://charts/fluent-bit
  condition: fluent-bit.enabled
- name: kube-prometheus-stack
  alias: metrics
  version: 91.8.2
  repository: https://prometheus-community.github.io/helm-charts
  condition: metrics.enabled
