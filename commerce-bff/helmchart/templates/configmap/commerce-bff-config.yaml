apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "commerce-bff.name" . }}-config
  namespace: {{ include "commerce-bff.namespace" . }}
  labels:
    {{- include "commerce-bff.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
