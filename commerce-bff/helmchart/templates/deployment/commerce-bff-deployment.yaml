apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "commerce-bff.name" . }}
  namespace: {{ include "commerce-bff.namespace" . }}
  labels:
    {{- include "commerce-bff.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  minReadySeconds: {{ .Values.deployment.minReadySeconds }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "commerce-bff.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "commerce-bff.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/part-of: shopping-cart}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap/commerce-bff-config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.deployment.terminationGracePeriodSeconds }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "commerce-bff.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: {{ .Values.containerPort }}, protocol: TCP}]
          envFrom:
            - configMapRef: {name: {{ include "commerce-bff.name" . }}-config}
            - secretRef: {name: {{ .Values.externalSecret.targetName }}}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.deployment.preStopDelaySeconds }}"]
          startupProbe:
            httpGet: {path: {{ .Values.probes.startup.path }}, port: http}
            {{- omit .Values.probes.startup "path" | toYaml | nindent 12 }}
          livenessProbe:
            httpGet: {path: {{ .Values.probes.liveness.path }}, port: http}
            {{- omit .Values.probes.liveness "path" | toYaml | nindent 12 }}
          readinessProbe:
            httpGet: {path: {{ .Values.probes.readiness.path }}, port: http}
            {{- omit .Values.probes.readiness "path" | toYaml | nindent 12 }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
