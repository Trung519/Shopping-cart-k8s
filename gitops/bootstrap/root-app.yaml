apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopping-cart-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Trung519/Shopping-cart-k8s.git
    targetRevision: dev
    path: gitops/control-plane
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Manual sync: the root installs only the project and ApplicationSet.
  # No cascade-delete finalizer or automated pruning.
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
